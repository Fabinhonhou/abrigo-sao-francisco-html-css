<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntário - Abrigo São Francisco</title>
    <link rel="stylesheet" href="css/projects.css" media="screen and (min-width:1033px)" type="text/css">
    <link rel="stylesheet" href="css/projects_tablet.css" media="screen and (min-width:768px) and (max-width:1032px)" type="text/css">
    <link rel="stylesheet" href="css/projects_mobile.css" media="screen and (max-width:767px)" type="text/css">
</head>

<body class="creme">

    <header class="nav-bar">
        <div class="logo-container">
            <img src="imagens/logotipo_abrogoSF.svg" class="logotipo" alt="Logo do Abrigo São Francisco" width="50"
                height="50" loading="eager">
            <p class="escritalogo">
                <strong>Abrigo</strong>
                <span>São Francisco</span>
            </p>
        </div>
        <div class="menu-toggle"
            onclick="document.querySelector('.navegacao').classList.toggle('ativa'); this.classList.toggle('ativa');">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="navegacao">
            <ul class="abas-nav">
                <li><a href="index.html">O abrigo</a></li>
                <li><a href="projects.html">Adoção</a></li>
                <li><a href="projects.html">Como ajudar</a></li>
                <li><a href="projects.html">Transparência</a></li>
                <li><a href="cadastro.html" class="ajudar-button">Quero ajudar ♡</a></li>
            </ul>
        </nav>
    </header>


    <main class="seccao-cadastro">

        <div class="cabecalho-cadastro">
            <h1>Faça parte do recomeço</h1>
            <p>Preencha seus dados para se cadastrar como voluntário do Abrigo São Francisco.</p>
        </div>

        <form action="pagina.php" method="POST" class="formulario-cadastro">

            <fieldset class="grupo-campos">
                <legend>Dados Pessoais</legend>

                <div class="grid-form">
                    <div class="campo-form col-total">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="campo-form">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="campo-form">
                        <label for="nascimento">Data de Nascimento *</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>

                    <div class="campo-form">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                            placeholder="000.000.000-00" title="Formato: 000.000.000-00" required>
                    </div>

                    <div class="campo-form">
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{5}-\d{4}"
                            placeholder="(00) 00000-0000" title="Formato: (00) 00000-0000" required>
                    </div>
                </div>
            </fieldset>


            <fieldset class="grupo-campos">
                <legend>Endereço</legend>

                <div class="grid-form">
                    <div class="campo-form">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000"
                            title="Formato: 00000-000" required>
                    </div>

                    <div class="campo-form">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Sua Cidade" required>
                    </div>

                    <div class="campo-form">
                        <label for="endereco">Endereço (Rua, Número, Bairro) *</label>
                        <input type="text" id="endereco" name="endereco"
                            placeholder="Ex. Rua tiradentes, 123 - Guaianases" required>
                    </div>

                    <div class="campo-form">
                        <label for="estado">Estado *</label>
                        <select id="estado" name="estado" required>
                            <option value="" selected disabled>Selecione seu estado</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>

                        </select>
                    </div>
                </div>
            </fieldset>


            <div class="container-botao-enviar">
                <button type="submit" class="btn-enviar-cadastro">FINALIZAR CADASTRO</button>
            </div>

        </form>
    </main>

</body>

</html>
